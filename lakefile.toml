name = "LeanVIPR"
defaultTargets = ["LeanVIPR", "viprcheck"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0"

[[lean_lib]]
name = "LeanVIPR"

[[lean_exe]]
name = "viprcheck"
root = "LeanVIPRMain"
